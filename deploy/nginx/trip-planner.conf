# trip-planner nginx 站点配置
# 由 deploy.sh 渲染：__DOMAIN__ / __ROOT__ / __PORT__
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # TLS 片段由 deploy.sh 生成：证书存在时这里会多出 443 监听和 80->443 跳转，
    # 所以重复执行部署脚本不会把 certbot 配好的 HTTPS 覆盖掉。
    include /etc/nginx/snippets/trip-planner-tls.conf;

    root __ROOT__;
    index index.html;
    charset utf-8;

    # 前端只有静态资源和小 JSON 请求；打卡图片走 /api/ 单独放宽
    client_max_body_size 20m;

    # 前端主包 2.19MB，必须开 gzip，否则 3M 带宽下首屏要 6 秒
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/trip-planner.access.log;
    error_log  /var/log/nginx/trip-planner.error.log;

    # 带 hash 的资源可长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，否则发版后用户拿到旧包
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端接口：同源反代，前端用相对路径 /api/xxx
    # 生成计划要等 LLM 1~2 分钟，超时必须放大，否则 504
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;

        # 打卡照片走这个前缀。前端已经把长边压到 1600px（通常 200~500KB），
        # 但老客户端 / 未压缩的图也要能传，这里留足余量，别让 nginx 先返回 413。
        client_max_body_size 30m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__PORT__/health;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Vue Router 用 createWebHistory，刷新深链接要回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
